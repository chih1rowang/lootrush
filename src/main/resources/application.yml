spring:
  application:
    name: lootrush
  datasource:
    url: jdbc:mysql://localhost:3308/lootrush?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,prometheus,beans,env,configprops
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

server:
  port: 8080

jwt:
  secret: lootrush-dev-secret-0123456789abcdef0123456789
  expire-minutes: 720

admin:
  password: admin123
  token: lootrush-admin-token-2026

rocketmq:
  name-server: localhost:9876
  producer:
    group: lootrush-producer
    send-message-timeout: 5000

pay:
  secret: lootrush-pay-hmac-secret-2026-0912
mock-pay:
  base-url: http://localhost:18090

order:
  # 开源RocketMQ延迟消息为固定档位（1s..10m/20m/30m/1h/2h），无15分钟档：
  # 级别15=20分钟，作为关单延迟的默认值；验收时可用环境变量注入小档位（如3=10秒）
  close-delay-level: ${ORDER_CLOSE_DELAY_LEVEL:15}
  # 超过该分钟数仍未支付的订单由扫表兜底关闭（与延迟消息双保险）
  close-minutes: ${ORDER_CLOSE_MINUTES:20}
  # 扫表兜底轮询间隔（秒）
  close-scan-seconds: ${ORDER_CLOSE_SCAN_SECONDS:60}

recon:
  # 每日对账时间（凌晨2点）；验收用管理端手动触发接口
  cron: ${RECON_CRON:0 0 2 * * ?}


