<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>夺宝支付 - 确认付款</title>
<style>
  body{background:#0d0f1a;color:#e8e8f0;font-family:system-ui;display:flex;
       justify-content:center;align-items:center;height:100vh;margin:0}
  .card{background:#171a2c;border:1px solid #3b3f5c;border-radius:14px;
        padding:40px 48px;text-align:center;min-width:340px}
  h1{font-size:20px;margin:0 0 24px;color:#9db4ff}
  .row{margin:12px 0;font-size:15px}
  .amount{font-size:34px;font-weight:700;color:#ffd76a;margin:16px 0}
  button{margin-top:24px;background:linear-gradient(90deg,#5b6cff,#9b5bff);
         border:none;color:#fff;font-size:16px;padding:12px 40px;
         border-radius:8px;cursor:pointer}
  button:hover{filter:brightness(1.15)}
  pre{margin-top:20px;text-align:left;font-size:12px;color:#8f96b3;
      max-height:180px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
  <h1>MOCK PAY · 夺宝支付</h1>
  <div class="row">订单号：<span id="orderNo"></span></div>
  <div class="amount"><span id="amount"></span> 钻石</div>
  <button onclick="pay()">确认付款</button>
  <pre id="result">（付款结果会显示在这里）</pre>
</div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('orderNo').textContent = q.get('orderNo') || '(未指定)';
document.getElementById('amount').textContent = q.get('amount') || '(未指定)';

async function pay() {
  const out = document.getElementById('result');
  out.textContent = '正在请求支付公司回调商户...';
  try {
    const resp = await fetch(`/mock-pay/confirm?orderNo=${q.get('orderNo')}&amount=${q.get('amount')}`, {method:'POST'});
    const data = await resp.json();
    out.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    out.textContent = '请求失败: ' + e;
  }
}
</script>
</body>
</html>
